# Builds the backend's production image and pushes it to Docker Hub as
# <DOCKERHUB_USERNAME>/gramwise_api:v<major>.<minor> (and :latest), whenever master gets a
# change that ends up in the image. Each release also gets a git tag of the same name on the
# commit it was built from.
#
# Versions count up one minor at a time, and the minor rolls over into the major after 9:
# v1 (the first release, tagged by hand), v1.1, ..., v1.9, v2.0, v2.1, ...
#
# Needs, in Settings > Secrets and variables > Actions:
#   - variable DOCKERHUB_USERNAME: the Docker Hub account the image is pushed to.
#   - secret DOCKERHUB_TOKEN: a Docker Hub personal access token with Read & Write access.
name: Backend release

on:
  push:
    branches: [master]
    # Only changes that reach the image: the allow-list in backend/.dockerignore, the
    # Dockerfile, the .dockerignore itself, and this workflow, which decides how the image
    # is built. Tests, docs and scripts don't cut a release.
    paths:
      - backend/app/**
      - backend/migrations/**
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/Dockerfile
      - backend/.dockerignore
      - .github/workflows/backend-release.yml
  # Run by hand from the Actions tab. On master it cuts a release; on any other branch it only
  # runs the checks.
  workflow_dispatch:

# One release at a time, so two runs never pick the same version. A run that's waiting is
# replaced by a newer one, so quick merges release only the latest master.
concurrency:
  group: backend-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/gramwise_api

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both scripts run inside the compose `dev` service, as they do locally.
      - run: ./scripts/lint.sh
      - run: ./scripts/test.sh

  release:
    name: Build and push
    needs: check
    if: github.ref == 'refs/heads/master'
    # The Raspberry Pi is linux/arm64, so the image is built natively on an arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write # to push the release's git tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The next version after the highest vN or vN.M tag, where a bare vN counts as vN.0.
      # Other tags, such as v1.2.3, are ignored.
      - name: Pick the version
        id: version
        run: |
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed -nE 's#^[0-9a-f]+[[:space:]]+refs/tags/v([0-9]+)(\.([0-9]+))?$#\1 \3#p' \
            | sort -k1,1n -k2,2n | tail -n 1)
          if [[ -z $latest ]]; then
            version=v1.0
          else
            read -r major minor <<< "$latest"
            minor=${minor:-0}
            if (( minor >= 9 )); then
              version="v$(( major + 1 )).0"
            else
              version="v${major}.$(( minor + 1 ))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=gramwise_api
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,scope=backend-release,mode=max

      # Tagged only after the push succeeds, so every release tag has an image.
      - name: Tag the commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          echo "Pushed \`$IMAGE:$VERSION\` from \`${GITHUB_SHA::7}\`, tagged \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
